[project]
name = "portfolio-models"
version = "0.3.0"
description = "Self-hostable portfolio optimisation & tracking: 24 models (skfolio, Riskfolio-Lib, PyPortfolioOpt), walk-forward backtests, BIST/TEFAS/US/gold/crypto, TR/EN/DE"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["portfolio", "portfolio-optimization", "asset-allocation", "risk-parity", "hrp", "markowitz",
            "black-litterman", "backtesting", "streamlit", "skfolio", "riskfolio-lib", "pyportfolioopt",
            "bist", "tefas", "self-hosted", "quant-finance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Natural Language :: German",
    "Natural Language :: Turkish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Framework :: Streamlit",
]
authors = [
    { name = "Ozan Bayhan", email = "152163098+ozanbayhan@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "mcp>=1.20",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "psycopg[binary]>=3.3.9",
    "pyportfolioopt>=1.6.0",
    "riskfolio-lib>=7.4.1",
    "skfolio>=1.14.6",
    "sqlalchemy>=2.1.9",
    "streamlit[auth]>=1.67.0",
    "yfinance>=1.8.0",
]

[project.urls]
Homepage = "https://github.com/ozanbayhan/portfolio-models"
Demo = "https://portfolio-models.streamlit.app"
Documentation = "https://ozanbayhan.github.io/portfolio-models"
Issues = "https://github.com/ozanbayhan/portfolio-models/issues"
Changelog = "https://github.com/ozanbayhan/portfolio-models/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
portfolio-models = "portfolio_models.cli:main"
